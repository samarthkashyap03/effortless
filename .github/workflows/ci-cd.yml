name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — ci
  # Install dependencies, build the app, run tests.
  # If any step fails the workflow stops here and the Docker job never runs.
  # ---------------------------------------------------------------------------
  ci:
    name: Install, Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code onto the runner.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up the correct Node.js version.
      #    We pin to Node 20 to match the Dockerfile builder stage exactly.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache node_modules based on the lockfile.
          # On cache hit, npm ci is still run but it finishes in seconds.
          cache: npm

      # 3. Install all dependencies using the lockfile exactly.
      #    --frozen-lockfile equivalent for npm: npm ci.
      - name: Install dependencies
        run: npm ci

      # 4. Build the production bundle.
      #    VITE_* vars are injected from GitHub Actions secrets.
      #    If any secret is missing the build will warn but not fail —
      #    the bundle will just have an empty string for that value.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}

      # 5. Run the Vitest unit test suite.
      #    `npm test` calls `vitest run` (single-pass, non-watch mode).
      #    Exit code 1 on any failure stops the workflow here.
      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------------------
  # JOB 2 — docker
  # Build the Docker image and push it to Docker Hub.
  # Only runs on pushes to main (not on PRs) AND only if the ci job passed.
  # ---------------------------------------------------------------------------
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci  # waits for ci job to succeed before starting
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # 1. Check out the code (needed to access the Dockerfile).
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up QEMU — allows the runner to build images for multiple CPU
      #    architectures (e.g. amd64 and arm64 for Apple Silicon / AWS Graviton).
      #    Remove this step if you only target one architecture.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Set up Docker Buildx — the modern Docker build engine.
      #    Required for multi-platform builds and advanced caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log in to Docker Hub using credentials stored as GitHub secrets.
      #    DOCKERHUB_USERNAME: your Docker Hub username (e.g. samar123)
      #    DOCKERHUB_TOKEN:    an access token from hub.docker.com/settings/security
      #    Never put these values directly in the YAML — always use secrets.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Generate image tags and labels automatically.
      #    - tags the image as:
      #        <username>/effortless-saas:latest
      #        <username>/effortless-saas:<short-git-sha>  (e.g. abc1234)
      #    - adds OCI standard labels (source URL, revision, etc.)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/effortless-saas
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      # 6. Build the Docker image and push it to Docker Hub.
      #    --build-arg passes the VITE_* vars into the Dockerfile ARG declarations
      #    so Vite can bake them into the bundle at build time.
      #    cache-from / cache-to: reuse layer cache between runs using the
      #    GitHub Actions cache backend — dramatically speeds up repeat builds.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_EMAILJS_SERVICE_ID=${{ secrets.VITE_EMAILJS_SERVICE_ID }}
            VITE_EMAILJS_TEMPLATE_ID=${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
            VITE_EMAILJS_PUBLIC_KEY=${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
